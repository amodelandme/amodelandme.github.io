<header class="site-header" role="banner">
  <div class="site-header__row">
    <a href="{{ '/' | relative_url }}" class="site-header__brand" aria-label="{{ site.title }} — home">
      {%- include mark.svg -%}
      <div>
        <div class="site-header__title">{{ site.title }}</div>
        <div class="site-header__tag">// {{ site.tagline }}</div>
      </div>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}"
         class="site-nav__link"
         {% if page.url == '/' %}aria-current="page"{% endif %}>writing</a>
      <a href="{{ '/tags/' | relative_url }}"
         class="site-nav__link"
         {% if page.url contains '/tags' %}aria-current="page"{% endif %}>tags</a>
      <a href="{{ '/projects/' | relative_url }}"
         class="site-nav__link"
         {% if page.url contains '/projects' %}aria-current="page"{% endif %}>projects</a>
      <a href="{{ '/about/' | relative_url }}"
         class="site-nav__link"
         {% if page.url contains '/about' %}aria-current="page"{% endif %}>about</a>
      <a href="https://github.com/amodelandme"
         class="site-nav__link site-nav__github"
         target="_blank" rel="noopener" aria-label="GitHub">
        <svg class="site-nav__github-icon" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
            0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
            -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
            .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
            -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
            1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
            1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
            1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        github
      </a>

      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="theme-toggle__moon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 9.2a5.5 5.5 0 0 1-7-7 5.5 5.5 0 1 0 7 7Z" />
        </svg>
        <svg class="theme-toggle__sun" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3" />
          <path d="M8 1.5v1.5M8 13v1.5M1.5 8h1.5M13 8h1.5M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M3.3 12.7l1.1-1.1M11.6 4.4l1.1-1.1" stroke-linecap="round" />
        </svg>
        <span class="theme-toggle__label">theme</span>
      </button>

      <button class="nav-hamburger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
        <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
          <rect x="1" y="3" width="14" height="1.5" rx="0.75"/>
          <rect x="1" y="7.25" width="14" height="1.5" rx="0.75"/>
          <rect x="1" y="11.5" width="14" height="1.5" rx="0.75"/>
        </svg>
      </button>
    </nav>
  </div>

  <div class="site-header__strip" aria-hidden="true">
    <span class="site-header__live"></span>
    <span class="amber">live</span>
    <span>·</span>
    <span>amodelandme.dev</span>
    <span class="site-header__strip-rule"></span>
    <span>build · {{ site.time | date: "%Y-%m-%d" }}</span>
  </div>

  <nav class="mobile-menu" id="mobile-menu" aria-label="Mobile navigation" hidden>
    <a href="{{ '/' | relative_url }}"
       class="mobile-menu__link"
       {% if page.url == '/' %}aria-current="page"{% endif %}>writing</a>
    <a href="{{ '/tags/' | relative_url }}"
       class="mobile-menu__link"
       {% if page.url contains '/tags' %}aria-current="page"{% endif %}>tags</a>
    <a href="{{ '/projects/' | relative_url }}"
       class="mobile-menu__link"
       {% if page.url contains '/projects' %}aria-current="page"{% endif %}>projects</a>
    <a href="{{ '/about/' | relative_url }}"
       class="mobile-menu__link"
       {% if page.url contains '/about' %}aria-current="page"{% endif %}>about</a>
    <a href="https://github.com/amodelandme"
       class="mobile-menu__link mobile-menu__ext"
       target="_blank" rel="noopener">github ↗</a>
  </nav>
</header>

<script>
  (function () {
    var btn = document.querySelector('.nav-hamburger');
    var menu = document.getElementById('mobile-menu');
    if (!btn || !menu) return;
    btn.addEventListener('click', function () {
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', String(!open));
      menu.hidden = open;
    });
  })();
</script>
