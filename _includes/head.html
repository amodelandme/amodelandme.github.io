<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

{%- seo -%}

<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}" />
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}" />

<!-- Type — Space Grotesk + JetBrains Mono. Preconnect + display=swap so first
     paint isn't blocked. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />

<!-- Theme bootstrap — runs synchronously to avoid a paint of the wrong theme.
     Reads localStorage override, else falls through to the @media query in CSS. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
